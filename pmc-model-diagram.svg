<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>PMC 模型測試結果示意圖</title>
<desc>節點 i 對節點 j 進行測試,測試結果 a_ij 為 0 表示 j 正常(綠色),為 1 表示 j 故障(紅色)</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Case 1: result 0 -->
<circle cx="150" cy="80" r="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="150" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">i</text>

<circle cx="330" cy="80" r="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="330" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">j</text>

<line x1="176" y1="80" x2="304" y2="80" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240" y="58" text-anchor="middle" font-size="12" fill="#555">a_ij = 0</text>
<text x="240" y="112" text-anchor="middle" font-size="12" fill="#555">j 正常(fault-free)</text>

<!-- Case 2: result 1 -->
<circle cx="150" cy="200" r="26" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="150" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">i</text>

<circle cx="330" cy="200" r="26" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5"/>
<text x="330" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#501313">j</text>

<line x1="176" y1="200" x2="304" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240" y="178" text-anchor="middle" font-size="12" fill="#555">a_ij = 1</text>
<text x="240" y="232" text-anchor="middle" font-size="12" fill="#555">j 故障(faulty)</text>

<!-- Legend -->
<circle cx="470" cy="70" r="7" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="486" y="74" font-size="12" fill="#555">fault-free(正常)</text>
<circle cx="470" cy="100" r="7" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
<text x="486" y="104" font-size="12" fill="#555">faulty(故障)</text>
<text x="470" y="140" font-size="12" fill="#555">i 對 j 做測試,</text>
<text x="470" y="158" font-size="12" fill="#555">得到 j 的狀態</text>
</svg>
